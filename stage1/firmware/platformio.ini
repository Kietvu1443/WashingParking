; Mạch: ESP32 DevKit V1 (ESP32 thường, DOIT, micro-USB), 4 MB flash
; Chân: servo cổng vào 18, relay bơm nước 23, OLED I2C SDA 21 / SCL 22, nút 27 -> GND
[platformio]
default_envs = esp32dev   ; `pio run -t upload` chỉ nạp bản cho mạch thật

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    olikraus/U8g2@2.36.18
    madhephaestus/ESP32Servo@3.0.6

; Mạch thật: WiFi/broker lấy từ src/secrets.h.
; Chưa biết loại servo (180°/360°) -> SERVO_SAFE_90: khởi động chỉ gửi xung 1500 us một lần, lệnh mở/đóng chỉ ghi log.
[env:esp32dev]
build_flags =
    -DSERVO_SAFE_90=1

; Mô phỏng Wokwi (MÔ PHỎNG, chưa kiểm trên phần cứng). Chọn 1 trong 2 đường mạng:
;  A) Gateway riêng của Wokwi -> Mosquitto trên laptop:  BROKER_HOST=host.wokwi.internal, TOPIC_PREFIX=wp
;  B) Wokwi-GUEST + broker công cộng: BROKER_HOST=broker.hivemq.com, TOPIC_PREFIX=wp-<chuỗi ngẫu nhiên>
;     (server phải chạy với WP_BROKER / WP_TOPIC_PREFIX giống hệt)
;  Các cờ khác biệt mô phỏng/mạch thật: xem bảng trong stage1/README.md
[env:wokwi]
build_flags =
    -DSIM_WOKWI=1
    -DBROKER_HOST=\"host.wokwi.internal\"
    -DTOPIC_PREFIX=\"wp\"
    -DSIM_HEARTBEAT_MS=2000
    -DCHOICE_MAX_MS=400000
    -DSIM_SERIAL_BUTTON=1
